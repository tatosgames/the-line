name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: npm run check
      - run: npx vite build
      # The playable build of this commit, downloadable from the run's page.
      - uses: actions/upload-artifact@v7
        with:
          name: the-line-web
          path: dist
          if-no-files-found: error
      - if: &publish ${{ github.ref == 'refs/heads/feat/pixi-port' && github.event_name != 'pull_request' && !github.event.repository.private }}
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    if: *publish
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: pages
      queue: max
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check branch head
        id: branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          head=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/$GITHUB_REF_NAME" --jq '.object.sha')
          if [ "$head" = "$GITHUB_SHA" ]; then
            echo 'current=true' >> "$GITHUB_OUTPUT"
          fi
      - if: steps.branch.outputs.current == 'true'
        id: deployment
        uses: actions/deploy-pages@v5
