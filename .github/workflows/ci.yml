name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: npm run check
      - run: npx vite build
      # The playable build of this commit, downloadable from the run's page.
      - uses: actions/upload-artifact@v7
        with:
          name: the-line-web
          path: dist
          if-no-files-found: error
